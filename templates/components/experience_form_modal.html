<div id="add-experience-modal"
     class="project-form-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="add-experience-modal-title">
    <button type="button"
            class="project-form-modal__backdrop"
            popovertarget="add-experience-modal"
            popovertargetaction="hide"
            aria-label="Tutup form tambah pengalaman"></button>

    <div class="project-form-modal__content">
        <button type="button"
                class="project-form-modal__close"
                popovertarget="add-experience-modal"
                popovertargetaction="hide"
                aria-label="Tutup form tambah pengalaman">&times;</button>

        <h2 id="add-experience-modal-title">Tambah Pengalaman Baru</h2>
        <form id="experience-form"
              method="post"
              action="{% url 'main:create_experience_ajax' %}"
              class="project-form"
              novalidate>
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group" data-field="{{ field.name }}">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% if field.name == "ended_at" %}
                        <p class="form-help">Kosongkan jika pengalaman masih berlangsung.</p>
                    {% endif %}
                    <p class="form-error hide" data-error-for="{{ field.name }}"></p>
                </div>
            {% endfor %}
            <div class="project-form-modal__actions">
                <button type="button"
                        class="button button-secondary"
                        popovertarget="add-experience-modal"
                        popovertargetaction="hide">Batal</button>
                <button type="submit" class="button">Tambah Experience</button>
            </div>
        </form>
    </div>
</div>
